<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Editable source for the raster social card approved on 2026-08-18. Social crawlers receive the PNG derivative; the supplied PNG remains the canonical visual output. -->
  <defs>
    <linearGradient id="hero-shade" x1="90" y1="40" x2="1110" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.76"/>
      <stop offset="0.42" stop-color="#000000" stop-opacity="0.48"/>
      <stop offset="0.72" stop-color="#02070D" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#02070D" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="mark-focus" cx="0" cy="0" r="1" gradientTransform="translate(596 298) rotate(90) scale(242 410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03070D" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#03070D" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#03070D" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="bottom-fade" x1="600" y1="386" x2="600" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- The homepage temporal field remains the sole atmospheric image. -->
  <rect width="1200" height="630" fill="#03070D"/>
  <image href="hero/degov-governance-temporal-field-f885cd9c.png" x="0" y="-21" width="1200" height="672" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="630" fill="url(#hero-shade)"/>
  <rect width="1200" height="630" fill="url(#mark-focus)"/>
  <rect y="384" width="1200" height="246" fill="url(#bottom-fade)"/>

  <!-- Quiet structural rules retain the new site's measured governance-infrastructure language. -->
  <g stroke="#DCE7F8" stroke-opacity="0.13">
    <path d="M72.5 0V630"/>
    <path d="M1127.5 0V630"/>
    <path d="M0 80.5H1200"/>
    <path d="M0 550.5H1200"/>
  </g>
  <g stroke="#DCE7F8" stroke-opacity="0.045">
    <path d="M273.5 80V551"/>
    <path d="M472.5 80V551"/>
    <path d="M727.5 80V551"/>
    <path d="M927.5 80V551"/>
    <path d="M72 291.5H1128"/>
    <path d="M72 464.5H1128"/>
  </g>

  <!-- DeGov pinwheel, reconstructed as vector geometry so the identity stays crisp at every preview size. -->
  <g transform="translate(517.5 181) scale(0.55)" fill="#F5F3ED">
    <path d="M100.333 0L110.333 120L0.333 100V0H100.333Z"/>
    <path d="M300.333 0V100L110.333 120L200.333 0H300.333Z"/>
    <path d="M110.333 120L100.333 300H0.333V200L110.333 120Z"/>
    <path d="M110.333 120L300.333 200V300H200.333L110.333 120Z"/>
  </g>

  <!-- The wordmark is intentionally the only copy in the card; title and description remain in page metadata. -->
  <text
    x="600"
    y="434"
    text-anchor="middle"
    fill="#F5F3ED"
    font-family="Instrument Sans, Arial, sans-serif"
    font-size="56"
    font-weight="650"
    letter-spacing="4.8"
  >DEGOV.AI</text>
</svg>
